services:

  # ── MCP Server ────────────────────────────────────────────────
  google-analytics-mcp:
    build: .
    image: google-analytics-mcp:latest
    container_name: google-analytics-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    # Porta exposta apenas internamente — o Caddy faz o proxy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  # Rede externa compartilhada com google_ads_mcp e facebook_ads_mcp.
  # Crie uma vez no servidor: docker network create mcp-network
  # O Caddy já roda no google_ads_mcp — basta adicionar este serviço à rede.
  mcp-network:
    external: true
